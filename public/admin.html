<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mero-Bank | Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-wrapper">
    <header class="dash-header">
        <div class="bank-logo">mero-Bank Admin</div>
        <div class="header-right">
            <div class="header-icons">
                <div class="noti-container" style="position: relative; cursor: pointer;" onclick="toggleNotifications()">
                    🔔 <span id="noti-count" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; position: absolute; top: -5px; right: -5px;">0</span>
                    <div id="noti-dropdown" class="noti-dropdown hidden">
                        <h4>Notifications</h4>
                        <div id="noti-list">No new notifications</div>
                    </div>
                </div>
            </div>
            <button onclick="location.href='index.html'" style="width: 100px; background: #95a5a6; margin-left: 20px;">User View</button>
        </div>
    </header>

    <main class="dash-main">
        <div class="my-section admin-table-container">
            <h3>Pending Account Requests</h3>
            <table class="admin-table" style="border-left: 5px solid #e67e22;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Account No.</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pending-table-body"></tbody>
            </table>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <h4>Total Users</h4>
                <p id="total-users">0</p>
            </div>
            <div class="stat-card" style="border-left-color: #27ae60;">
                <h4>Total Deposits</h4>
                <p id="total-deposits">$0.00</p>
            </div>
            <div class="stat-card" style="border-left-color: #e67e22;">
                <h4>System Status</h4>
                <p>Active</p>
            </div>
        </div>

        <div class="my-section admin-table-container">
            <h3>Registered Users Management</h3>
            <input type="text" id="user-search" placeholder="Search by name or account number..." style="padding: 10px; margin-bottom: 20px; width: 100%; border-radius: 5px; border: 1px solid #ddd; font-size: 14px; box-sizing: border-box;">
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Account No.</th>
                        <th>Phone</th> 
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
    
                </tbody>
            </table>
        </div>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
